name: jcg-q30 immortalwrt-mt798x Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
  REPO_BRANCH: '25.12'
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: mt7981-ax3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

        DTS_FILE=$(find target/linux/mediatek/ -name "*jcg-q30-pro*.dts" -o -name "*jcg_q30-pro*.dts" | head -n 1)
        if [ -n "$DTS_FILE" ]; then
          echo "Replacing DTS partitions in: $DTS_FILE"
          sed -i '/partitions {/,/};/d' "$DTS_FILE"
          echo '&spi0 {' >> "$DTS_FILE"
          echo '	status = "okay";' >> "$DTS_FILE"
          echo '	pinctrl-names = "default";' >> "$DTS_FILE"
          echo '	pinctrl-0 = <&spi_flash_pins>;' >> "$DTS_FILE"
          echo '	flash@0 {' >> "$DTS_FILE"
          echo '		compatible = "spi-nand";' >> "$DTS_FILE"
          echo '		reg = <0>;' >> "$DTS_FILE"
          echo '		spi-max-frequency = <52000000>;' >> "$DTS_FILE"
          echo '		partitions {' >> "$DTS_FILE"
          echo '			compatible = "fixed-partitions";' >> "$DTS_FILE"
          echo '			#address-cells = <1>;' >> "$DTS_FILE"
          echo '			#size-cells = <1>;' >> "$DTS_FILE"
          echo '			partition@0 {' >> "$DTS_FILE"
          echo '				label = "BL2";' >> "$DTS_FILE"
          echo '				reg = <0x00000000 0x00100000>;' >> "$DTS_FILE"
          echo '				read-only;' >> "$DTS_FILE"
          echo '			};' >> "$DTS_FILE"
          echo '			partition@100000 {' >> "$DTS_FILE"
          echo '				label = "u-boot-env";' >> "$DTS_FILE"
          echo '				reg = <0x00100000 0x00080000>;' >> "$DTS_FILE"
          echo '			};' >> "$DTS_FILE"
          echo '			partition@180000 {' >> "$DTS_FILE"
          echo '				label = "Factory";' >> "$DTS_FILE"
          echo '				reg = <0x00180000 0x00200000>;' >> "$DTS_FILE"
          echo '				read-only;' >> "$DTS_FILE"
          echo '			};' >> "$DTS_FILE"
          echo '			partition@380000 {' >> "$DTS_FILE"
          echo '				label = "FIP";' >> "$DTS_FILE"
          echo '				reg = <0x00380000 0x00200000>;' >> "$DTS_FILE"
          echo '			};' >> "$DTS_FILE"
          echo '			partition@580000 {' >> "$DTS_FILE"
          echo '				label = "ubi";' >> "$DTS_FILE"
          echo '				reg = <0x00580000 0x06e80000>;' >> "$DTS_FILE"
          echo '			};' >> "$DTS_FILE"
          echo '		};' >> "$DTS_FILE"
          echo '	};' >> "$DTS_FILE"
          echo '};' >> "$DTS_FILE"
        fi

        MAKEFILE=$(find target/linux/mediatek/image/ -name "filogic.mk" -o -name "mt7981.mk" | head -n 1)
        if [ -n "$MAKEFILE" ]; then
          sed -i 's/IMAGE_SIZE := .*/IMAGE_SIZE := 113152k/g' "$MAKEFILE"
        fi

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j16

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2
